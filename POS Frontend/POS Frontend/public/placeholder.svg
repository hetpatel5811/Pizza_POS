<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Menu image placeholder</title>
  <desc id="desc">Fallback image used when a menu item photo is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4e8" />
      <stop offset="100%" stop-color="#ffe2cc" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <circle cx="130" cy="90" r="58" fill="#ffd6b8" />
  <circle cx="720" cy="420" r="70" fill="#ffd6b8" />
  <circle cx="680" cy="90" r="44" fill="#ffd6b8" />
  <g transform="translate(250 120)">
    <circle cx="150" cy="130" r="108" fill="#f9b88a" />
    <circle cx="150" cy="130" r="92" fill="#ffdfbc" />
    <circle cx="106" cy="84" r="11" fill="#e56a54" />
    <circle cx="180" cy="73" r="11" fill="#e56a54" />
    <circle cx="214" cy="132" r="11" fill="#e56a54" />
    <circle cx="134" cy="166" r="11" fill="#e56a54" />
    <circle cx="86" cy="132" r="11" fill="#e56a54" />
    <circle cx="170" cy="178" r="9" fill="#7b8b45" />
    <circle cx="112" cy="110" r="9" fill="#7b8b45" />
    <circle cx="192" cy="104" r="9" fill="#7b8b45" />
  </g>
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#822727">
    Fresh &amp; Hot Pizza
  </text>
  <text x="400" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#9a4d35">
    Image will appear here
  </text>
</svg>
